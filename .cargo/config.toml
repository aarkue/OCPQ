[env]
TS_RS_EXPORT_DIR = { value = "frontend/src/types/generated", relative = true }

# `getrandom` 0.3 has no default backend on `wasm32-unknown-unknown`; the browser one has to be
# selected explicitly. Reached transitively through `rand` and `uuid`.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
