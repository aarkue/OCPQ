[package]
name = "backend-shared"
version = "0.1.0"
edition = "2021"

# Transport-agnostic half of every OCPQ backend: the item registry, the `Backend` trait, and the
# generic entry points the axum server, tauri app and wasm build all expose verbatim.

[dependencies]
ocpq-core = { path = "../ocpq-core" }
# Its test module uses `#[register_binding]`, which needs the crate in scope under this exact name.
process_mining = { workspace = true }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }

[features]
default = ["bindings"]
# Present so the `#[register_binding]` macro's `cfg(feature = "bindings")` gate resolves here too;
# `process_mining/bindings` is already forced by the dependency above.
bindings = ["process_mining/bindings"]
# OCEL 2.0 SQLite import/export. Links native sqlite3, so native targets only.
ocel-sqlite = ["ocpq-core/ocel-sqlite"]
# OCEL 2.0 bundle import (a directory or `.ocel.zip` archive of per-type CSV tables). Buildable for wasm32.
ocel-bundle = ["ocpq-core/ocel-bundle"]
# Adds Parquet as a bundle storage format, on top of CSV. Pulls in the `parquet` crate.
ocel-bundle-parquet = ["ocel-bundle", "ocpq-core/ocel-bundle-parquet"]
# File-backed extraction sources: SQLite, CSV and Parquet, all readable from bytes and all
# buildable for wasm32 (`dbcon` substitutes `sqlite-wasm-rs` there).
extraction-dbcon = ["ocpq-core/extraction-dbcon"]
# DuckDB links a native library and has no wasm32 build, so it is opt-in like PostgreSQL.
extraction-dbcon-duckdb = ["extraction-dbcon", "ocpq-core/extraction-dbcon-duckdb"]
# Adds PostgreSQL, which pulls `sqlx` and does not build for wasm32.
extraction-dbcon-postgres = ["extraction-dbcon", "ocpq-core/extraction-dbcon-postgres"]
