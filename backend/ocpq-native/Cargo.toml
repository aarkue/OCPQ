[package]
name = "ocpq-native"
version = "0.1.0"
edition = "2021"

# The parts of OCPQ that need a live OS: an SSH session to an HPC cluster and the tokio runtime
# driving it. Split out of `ocpq-core` so that crate stays buildable for wasm32.

[dependencies]
ocpq-core = { path = "../ocpq-core" }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
ts-rs = { version = "12.0", features = ["serde-compat", "chrono-impl"] }
slurry = { git = "https://github.com/aarkue/slurry", features = [
    "ssh",
], version = "0.1.7" }
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
anyhow = "1.0.95"
uuid = "1.7.0"
