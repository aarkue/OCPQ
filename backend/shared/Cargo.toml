[package]
name = "ocpq-shared"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = {version = "1.0.192" , features = ["derive", "rc"]}
serde_json = "1.0.108"
serde_with = "3.11.0"
ts-rs = { version = "12.0", features = ["serde-compat","chrono-impl"] }
process_mining = { path = "/home/aarkue/doc/projects/branch-copies/rust4pm/process_mining", features = ["ocel-sqlite", "extraction-blueprint"] }
# The dbcon-backed row provider lives in its own crate: `dbcon` is a git dependency with no
# crates.io release, and cargo publish rejects any dependency without a version requirement,
# so keeping it here would make process_mining itself unpublishable.
process_mining_dbcon = { path = "/home/aarkue/doc/projects/branch-copies/rust4pm/process_mining_dbcon" }
rayon = "1.8.0"
itertools = "0.11.0"
chrono = "0.4.33"
uuid = "1.7.0"
rand = "0.8.5"
cel-interpreter = {version = "0.9.0", features = ["chrono"]}
once_cell = "1.19.0"
dirs-next = "2.0.0"
csv = "1.3.0"
rust_xlsxwriter = {version = "0.80.0", features = ["chrono"]}
ordered-float = {version = "4.4.0", features = ["default","serde"]}
anyhow = "1.0.95"
slurry = { git = "https://github.com/aarkue/slurry", features = ["ssh"], version = "0.1.7"}
tokio = { version = "1.43", features = ["full"] }
rayon-cancel = "1.0.0"
# MACHINE-LOCAL PATH DEPENDENCY -- not a permanent arrangement. `dbcon`'s
# `feat/backends-and-discovery` branch is not pushed, so there is no revision to pin; this goes
# back to a `git = ...` dependency once it is. Features are mandatory now (`default = []`): a
# featureless `dbcon` compiles but recognises no connection string, so `connect_and_get_metadata`
# would fail on every input.
dbcon = { path = "/home/aarkue/doc/projects/dbcon", features = [
    "postgres",
    "sqlite",
    "csv",
    "parquet",
] }
regex = "1.10"
regex-syntax = "0.8"
futures = "0.3"
mimalloc = { version = "0.1.47", default-features = false }
