[package]
name = "ocpq-web-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.7", features = ["default", "macros"] }
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
ocpq-core = { path = "../ocpq-core", features = ["ocel-sqlite"] }
ocpq-native = { path = "../ocpq-native" }
app-bindings = { path = "../app-bindings", features = [
    "ocel-sqlite",
    "extraction-dbcon-postgres",
] }
backend-shared = { path = "../backend-shared", features = [
    "ocel-sqlite",
    "extraction-dbcon-postgres",
] }
tower-http = { version = "0.6.1", features = ["cors", "fs"] }
