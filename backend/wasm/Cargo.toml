[package]
name = "ocpq-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# In-browser OCPQ backend. `ocel-sqlite`/`extraction-dbcon-postgres` are excluded because they link
# native libs that don't build for wasm32; `ocel-bundle-parquet` is excluded for the same reason.

[dependencies]
backend-shared = { path = "../backend-shared", features = ["extraction-dbcon", "ocel-bundle"] }
app-bindings = { path = "../app-bindings", features = ["extraction-dbcon", "ocel-bundle"] }
wasm-bindgen = "0.2.84"
serde = { version = "1.0.192", features = ["derive"] }
serde_json = "1.0.108"
gloo-utils = { version = "0.2", features = ["serde"] }
console_error_panic_hook = { version = "0.1.7", optional = true }

# `ocpq-core` pulls in `rand`/`getrandom`; on wasm the `wasm_js` backend needs this feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.7.0", features = ["v4", "serde", "js"] }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
