[workspace]
resolver = "2"

members = [
	"backend/shared",
  "backend/web-server",
  "backend/ocpq_cli",
  "tauri/src-tauri/"
]


# There is deliberately no `[patch.crates-io]` table. It used to redirect crates.io `sqlx` to
# `aarkue/sqlx-fix` so that the copy `dbcon` pulled in transitively through `sea-schema` agreed
# with `rusqlite` on `libsqlite3-sys` (two versions of a `links`-declaring crate is a hard
# resolver error). `dbcon` dropped `sea-schema` and names the fork directly, so the only
# remaining `sqlx` in the graph is already the fork and the patch was unused.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release.package.ocpq-web-server]
opt-level = 3